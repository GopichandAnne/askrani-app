name: Run migrations

# UI-guided DB migrations: Actions -> "Run migrations" -> Run workflow.
# Applies any migrations in supabase/migrations/ not yet on the linked project,
# in order, each in its own transaction (so enum-add-before-use is respected).
# Needs three repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  — Supabase -> Account -> Access Tokens (you have this)
#   SUPABASE_PROJECT_REF   — ctdczunzetcftcadbrot (you have this)
#   SUPABASE_DB_PASSWORD   — Supabase -> Project Settings -> Database -> password
on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
      - name: Show migration status
        run: supabase migration list
      - name: Push migrations
        run: supabase db push
